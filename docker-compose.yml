version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: network_scanner_backend
    ports:
      - "8000:8000"
    volumes:
      - ./results:/app/results
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: network_scanner_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
